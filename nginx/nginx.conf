upstream app_server {
    server web:8000;
}

# When a host nginx or tunnel terminates TLS in front of this container it
# already set X-Forwarded-Proto. Passing $scheme blindly would tell Django the
# request was plain http, which breaks secure-cookie and redirect behaviour.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Re-resolve the app container at request time. Without this nginx caches the
    # container IP from startup and every redeploy 502s until nginx is recreated.
    resolver 127.0.0.11 valid=10s;

    location /healthz {
        proxy_pass http://app_server;
        # Without an explicit Host, nginx sends the upstream block's name
        # ("app_server") and Django rejects it as an invalid host header.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        access_log off;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Customer documents are ONLY served through authenticated Django views.
    location ^~ /media/conversations/ { return 404; }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # Websockets for the live inbox.
    location /ws/ {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_redirect off;
    }
}
