{% if messages %}
  <div class="mb-4 space-y-2" x-data="{show:true}" x-show="show">
    {% for message in messages %}
      <div class="flex items-start justify-between gap-3 rounded-xl border px-4 py-3 text-sm
        {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800
        {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-900
        {% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
        {% else %}border-sky-200 bg-sky-50 text-sky-800{% endif %}">
        <span>{{ message }}</span>
        <button @click="show=false" class="text-current opacity-50 hover:opacity-100">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
