{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-slate-200 bg-white p-6">
  <h1 class="text-lg font-semibold">Change your password</h1>
  <form method="post" class="mt-4 space-y-4">{% csrf_token %}
    {{ form.as_div }}
    <button class="rounded-lg accent px-4 py-2 text-white">Save</button>
  </form>
</div>
{% endblock %}
