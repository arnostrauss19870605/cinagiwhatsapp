<div class="p-5">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-[#0065A9]">{{ label }}{% if is_start %} · <span class="text-[#3d7a1e]">first step</span>{% endif %}</p>
      <h2 class="truncate text-base font-semibold text-slate-900">{{ step.name }}</h2>
    </div>
    <button type="button" onclick="WorkflowBuilder.closePanel()" class="text-slate-400 hover:text-slate-700" title="Close">✕</button>
  </div>

  {% if saved %}
    <p class="mt-3 rounded-lg bg-[#76BD4C]/15 px-3 py-2 text-sm text-[#3d7a1e]">Saved to the draft.</p>
  {% endif %}
  {% if errors %}
    <ul class="mt-3 list-disc space-y-0.5 rounded-lg bg-rose-50 py-2 pl-7 pr-3 text-sm text-rose-800">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
  {% endif %}

  <form hx-post="{% url 'workflows:builder_panel' workflow.pk step_id %}" hx-target="#wf-panel-body" hx-swap="innerHTML" class="mt-4 space-y-5">
    {% csrf_token %}
    {% include "workflows/partials/step_fields.html" %}
    <div class="flex items-center justify-between border-t border-slate-100 pt-4">
      <button type="button" onclick="WorkflowBuilder.removeStep('{{ step_id|escapejs }}')" class="text-sm text-slate-400 hover:text-rose-600">Remove step</button>
      <button class="rounded-xl bg-[#0065A9] px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#005490]">Save</button>
    </div>
  </form>
</div>
